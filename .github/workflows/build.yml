name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      vscodium_version:
        description: "VSCodium release tag (e.g. 1.140.06880)"
        required: false
        default: ""
      agent_vsix_url:
        description: "Direct URL to tkbk-agent .vsix (default: latest GitHub release of tkbk-online/tkbk-agent)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-14
            platform: darwin-arm64
          - os: macos-13
            platform: darwin-x64
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VSCODIUM_VERSION: ${{ github.event.inputs.vscodium_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Download tkbk-agent .vsix from URL (optional)
        if: ${{ github.event.inputs.agent_vsix_url != '' }}
        shell: bash
        run: |
          mkdir -p .cache/agent
          curl -fsSL -o .cache/agent/tkbk-agent.vsix "${{ github.event.inputs.agent_vsix_url }}"
          echo "TKBK_AGENT_VSIX=$PWD/.cache/agent/tkbk-agent.vsix" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          ARGS="--platform ${{ matrix.platform }}"
          if [ -n "$VSCODIUM_VERSION" ]; then ARGS="$ARGS --codium $VSCODIUM_VERSION"; fi
          node build/build.mjs $ARGS

      - name: Checksums
        shell: bash
        run: |
          cd dist
          for f in TKBK-IDE-*; do
            [ -f "$f" ] || continue
            if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
          done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: tkbk-ide-${{ matrix.platform }}
          path: |
            dist/TKBK-IDE-*
            dist/build-*.json
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/TKBK-IDE-*
          generate_release_notes: true
          draft: true
